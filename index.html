  <div class="app">

    <!-- 시작 화면 -->
    <section id="screen-start" class="screen active">
      <button class="mute-btn mute-toggle" title="음악/효과음 켜기·끄기">🔊</button>

      <h1>🐾 구구단 동물 친구</h1>
      <p class="subtitle">정답을 맞히고 귀여운 동물 친구를 모아보자!</p>

      <div class="meta-stats">
        <div class="meta-chip">💖 <span id="totalCoins">0</span></div>
        <div class="meta-chip">🔥 최고 콤보 <span id="bestComboEver">0</span></div>
      </div>

      <div class="animal-dex" id="animalDex"></div>

      <p class="subtitle">도전할 단을 골라보세요!</p>
      <div class="dan-grid" id="danGrid"></div>

      <div class="dan-actions">
        <button class="btn small" id="selectAllBtn">전체 선택</button>
        <button class="btn small" id="selectNoneBtn">선택 해제</button>
      </div>

      <p class="subtitle">문제 개수를 골라보세요!</p>
      <div class="count-grid" id="countGrid">
        <button class="btn count-btn" data-count="10">10문제</button>
        <button class="btn count-btn selected" data-count="15">15문제</button>
        <button class="btn count-btn" data-count="20">20문제</button>
      </div>

      <button class="btn primary big" id="startBtn">모험 시작! 🐾</button>
      <p class="error-msg" id="startError"></p>
    </section>

    <!-- 게임 화면 -->
    <section id="screen-game" class="screen">
      <button class="mute-btn mute-toggle" title="음악/효과음 켜기·끄기">🔊</button>
      <div class="hud">
        <div class="hud-item">💖 <span id="coins">0</span></div>
        <div class="hud-item combo-hud" id="comboHud">🔥 <span id="streak">0</span></div>
        <div class="hud-item">📋 <span id="progress">0</span> / <span id="total">15</span></div>
      </div>

      <div class="progress-bar-outer">
        <div class="progress-bar-inner" id="progressBar"></div>
      </div>

      <div class="arena">
        <div class="animal-wrap">
          <div class="animal" id="animal">🐰</div>
          <div class="hit-fx" id="heartFx"></div>
        </div>
        <div class="timer-bar-outer">
          <div class="timer-bar-inner" id="timerBar"></div>
        </div>
      </div>

      <div class="question" id="question">3 × 4 = ?</div>

      <div class="choices" id="choices"></div>

      <div class="feedback" id="feedback"></div>
      <div class="combo-popup" id="comboPopup"></div>
    </section>

    <!-- 결과 화면 -->
    <section id="screen-result" class="screen">
      <h1 id="resultTitle">🎉 성공!</h1>

      <div class="stars-row" id="starsRow">
        <span class="star">☆</span><span class="star">☆</span><span class="star">☆</span>
      </div>

      <div class="new-friends" id="newFriends"></div>

      <div class="result-card">
        <div class="result-row"><span>클리어한 단</span><span id="resultDans">-</span></div>
        <div class="result-row"><span>정답률</span><span id="resultAccuracy">0%</span></div>
        <div class="result-row"><span>최고 콤보</span><span id="resultBestStreak">0</span></div>
        <div class="result-row"><span>모은 하트</span><span id="resultCoins">0</span></div>
      </div>
      <div id="resultBadge" class="result-badge"></div>

      <button class="btn share big" id="shareBtn">결과 공유하기 📤</button>
      <button class="btn primary big" id="retryBtn">다시 도전하기 🔁</button>
      <button class="btn big" id="homeBtn">단 다시 고르기</button>
    </section>

  </div>
